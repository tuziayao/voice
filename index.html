<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>あいことば</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }
    #message {
      font-size: 24px;
      margin: 20px;
    }
    #image-container img {
      width: 300px;
      height: auto;
      display: none;
    }
    #retry-button {
      display: none;
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
    }
    #retry-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>あいことばを答えてね（正解：開けゴマ）</h1>
  <div id="message">音声認識を待っています...</div>
  <div id="image-container">
    <img id="correct-image" src="image/correct.png" alt="せいかい">
    <img id="wrong-image" src="image/wrong.png" alt="ちがうよ">
  </div>
  <button id="retry-button">もう一度答える</button>

  <script>
    // 音声認識の初期化
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'ja-JP'; // 日本語設定

    // DOM要素
    const message = document.getElementById('message');
    const correctImage = document.getElementById('correct-image');
    const wrongImage = document.getElementById('wrong-image');
    const retryButton = document.getElementById('retry-button');

    // 初期状態を設定する関数
    function resetGame() {
      message.textContent = '音声認識を待っています...';
      correctImage.style.display = 'none';
      wrongImage.style.display = 'none';
      retryButton.style.display = 'none';
      recognition.start(); // 音声認識を再開
    }

    // 音声認識が成功したときの処理
    recognition.onresult = (event) => {
      const spokenText = event.results[0][0].transcript; // 認識されたテキスト
      console.log('認識された内容:', spokenText);

      if (spokenText.includes('開けごま')) {
        message.textContent = 'せいかい！';
        correctImage.style.display = 'block';
        wrongImage.style.display = 'none';
      } else {
        message.textContent = `${spokenText} - ちがうよ！`;
        correctImage.style.display = 'none';
        wrongImage.style.display = 'block';
      }

      retryButton.style.display = 'block'; // ボタンを表示
    };

    // エラー処理
    recognition.onerror = (event) => {
      message.textContent = 'エラーが発生しました: ' + event.error;
      retryButton.style.display = 'block'; // ボタンを表示
    };

    // 初期状態のセットアップ
    resetGame();

    // 「もう一度答える」ボタンのクリックイベント
    retryButton.addEventListener('click', resetGame);
  </script>
</body>
</html>
